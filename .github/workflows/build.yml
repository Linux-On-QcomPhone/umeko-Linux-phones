name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_ENV: devices/wt88047.env
  PACK_VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: wt88047 (msm8916)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned kernel submodule (shallow)
        run: git submodule update --init --depth 1 kernels/msm8916

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu bc bison flex libssl-dev libncurses-dev kmod ccache dwarves \
            qemu-user-static mkbootimg android-sdk-libsparse-utils e2fsprogs zip curl ca-certificates

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-wt88047
          max-size: 500M

      - name: Cache ubuntu-base tarball
        uses: actions/cache@v4
        with:
          path: .cache
          key: ubuntu-base-24.04.3-arm64

      - name: Build kernel
        run: ./scripts/build_kernel.sh "$DEVICE_ENV"

      - name: Build rootfs image
        run: ./scripts/build_rootfs.sh "$DEVICE_ENV"

      - name: Assemble rootfs (chroot)
        run: ./scripts/assemble.sh "$DEVICE_ENV"

      - name: Pack flashing bundle
        run: ./scripts/pack.sh "$DEVICE_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wt88047-package
          path: out/*.zip
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
