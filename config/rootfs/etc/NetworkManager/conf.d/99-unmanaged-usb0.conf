# usb0 is the configfs NCM gadget interface, statically configured as
# 192.168.100.1/24 by ncm-serial-setup.sh. NetworkManager must not manage
# it — otherwise NM claims the interface, flushes the static address and
# runs a pointless DHCP client on it (no DHCP server on the USB link).
[keyfile]
unmanaged-devices=interface-name:usb0
